name: auto-update-iterm2

on:
  schedule:
    - cron: "0 10 * * 1" # weekly, Mondays 10:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Don't open a PR, just commit and push the branch"
        type: boolean
        default: true
      target:
        description: "Repo to open the PR against"
        type: choice
        options:
          - upstream
          - origin
        default: origin

concurrency:
  group: update-iterm2
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: macos-latest
    steps:
      - name: Sync fork's master with upstream
        env:
          GH_TOKEN: ${{ secrets.NIXPKGS_AUTO_UPDATE_TOKEN }}
        run: gh repo sync emaiax/nixpkgs --branch master

      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1 # content is fully replaced by the reset below
          persist-credentials: false # otherwise this shadows GH_TOKEN below and every push authenticates as github-actions[bot]

      - name: Resolve the PR target repo
        id: target
        run: |
          if [ "${{ github.event.inputs.target }}" = "upstream" ]; then
            echo "repo=NixOS/nixpkgs" >> "$GITHUB_OUTPUT"
            echo "base=master" >> "$GITHUB_OUTPUT"
          else
            echo "repo=emaiax/nixpkgs" >> "$GITHUB_OUTPUT"
            # GitHub's sync above can lag a few seconds; a stale master would repeat
            # emaiax/nixpkgs#1's blowup. update/iterm2-base pins the pre-bump commit instead.
            echo "base=update/iterm2-base" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync local checkout with upstream nixpkgs
        run: |
          git remote add upstream https://github.com/NixOS/nixpkgs.git
          git fetch --depth 1 upstream master
          git reset --hard upstream/master

      # TODO: drop once update.sh's nix-shell -p gnused fix lands upstream.
      - name: Apply temporary gnused patch (pending upstream PR)
        run: |
          sed -i '' \
            's/-p curl coreutils common-updater-scripts/-p curl coreutils gnused common-updater-scripts/' \
            pkgs/by-name/it/iterm2/update.sh

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Read the current version
        id: old_version
        run: |
          old_version=$(nix-instantiate --eval -E "with import ./. {}; iterm2.version" | tr -d '"')
          echo "version=$old_version" >> "$GITHUB_OUTPUT"

      - name: Run iterm2's update.sh
        run: ./pkgs/by-name/it/iterm2/update.sh

      - name: Check for a version change
        id: diff
        run: |
          if git diff --quiet -- pkgs/by-name/it/iterm2/package.nix; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Read the new version
        if: steps.diff.outputs.changed == 'true'
        id: version
        run: |
          version=$(nix-instantiate --eval -E "with import ./. {}; iterm2.version" | tr -d '"')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Runs before the branch changes: querying right after our own force-push can
      # race GitHub's API. Reading the pre-push remote branch's version avoids that.
      - name: Check if this version is already proposed on the target repo
        id: existing
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.NIXPKGS_AUTO_UPDATE_TOKEN }}
          # persist-credentials: false strips origin's auth, so a network hiccup can fall
          # back to a credential prompt; on macos-latest that hangs for hours. Fail fast instead.
          GIT_TERMINAL_PROMPT: "0"
        run: |
          echo "up_to_date=false" >> "$GITHUB_OUTPUT"
          if git -c credential.helper= fetch --depth=1 origin update/iterm2; then
            open_pr=$(gh pr list --repo ${{ steps.target.outputs.repo }} --head update/iterm2 --state open --json number,headRepositoryOwner --jq '[.[] | select(.headRepositoryOwner.login == "emaiax")][0].number')
            existing_version=$(git show FETCH_HEAD:pkgs/by-name/it/iterm2/package.nix | sed -n 's/.*version = "\([^"]*\)".*/\1/p' | head -1)
            if [ -n "$open_pr" ] && [ "$existing_version" = "${{ steps.version.outputs.version }}" ]; then
              echo "PR #$open_pr already proposes iterm2 ${{ steps.version.outputs.version }}; nothing new to open."
              echo "up_to_date=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Build iterm2
        if: steps.diff.outputs.changed == 'true' && steps.existing.outputs.up_to_date != 'true'
        run: nix-build -A iterm2 --no-out-link

      - name: Commit and push the update/iterm2 branch
        if: steps.diff.outputs.changed == 'true' && steps.existing.outputs.up_to_date != 'true'
        env:
          GH_TOKEN: ${{ secrets.NIXPKGS_AUTO_UPDATE_TOKEN }}
        run: |
          git config user.name "emaiax"
          git config user.email "emaiax@users.noreply.github.com"
          git checkout -B update/iterm2
          base_sha=$(git rev-parse HEAD)
          git add pkgs/by-name/it/iterm2/package.nix
          git commit -m "iterm2: ${{ steps.old_version.outputs.version }} -> ${{ steps.version.outputs.version }}

          https://iterm2.com/downloads.html"
          # update/iterm2-base pins the pre-bump commit, so a target=origin PR's diff stays
          # correct even if the master sync above hasn't propagated yet (see emaiax/nixpkgs#1).
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/emaiax/nixpkgs.git" \
            "${base_sha}:refs/heads/update/iterm2-base" update/iterm2

      - name: Close a stale PR and open a new one against the target repo
        if: steps.diff.outputs.changed == 'true' && steps.existing.outputs.up_to_date != 'true' && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.NIXPKGS_AUTO_UPDATE_TOKEN }}
        run: |
          existing=$(gh pr list --repo ${{ steps.target.outputs.repo }} --head update/iterm2 --state open --json number,headRepositoryOwner --jq '[.[] | select(.headRepositoryOwner.login == "emaiax")][0].number')
          if [ -n "$existing" ]; then
            gh pr close "$existing" --repo ${{ steps.target.outputs.repo }} \
              --comment "superseded by iterm2 ${{ steps.version.outputs.version }}."
          fi
          cat > pr-body.md <<EOF
          Changelog: https://iterm2.com/downloads.html

          ## Things done

          - Built on platform:
            - [ ] x86_64-linux
            - [ ] aarch64-linux
            - [x] aarch64-darwin
          - Tested, as applicable:
            - [ ] [NixOS tests] in [nixos/tests].
            - [ ] [Package tests] at \`passthru.tests\`.
            - [ ] Tests in [lib/tests] or [pkgs/test] for functions and "core" functionality.
          - [ ] Ran \`nixpkgs-review\` on this PR. See [nixpkgs-review usage].
          - [ ] Tested basic functionality of all binary files, usually in \`./result/bin/\`.
          - Nixpkgs Release Notes
            - [ ] Package update: when the change is major or breaking.
          - NixOS Release Notes
            - [ ] Module addition: when adding a new NixOS module.
            - [ ] Module update: when the change is significant.
          - [x] Fits [CONTRIBUTING.md], [pkgs/README.md], [maintainers/README.md] and other READMEs.
          - [x] Follows the [automation/AI policy] — exempt as maintainer-approved automation running an existing update script, no LLM involved in this run's output.

          [NixOS tests]: https://nixos.org/manual/nixos/unstable/index.html#sec-nixos-tests
          [Package tests]: https://github.com/NixOS/nixpkgs/blob/master/pkgs/README.md#package-tests
          [nixpkgs-review usage]: https://github.com/Mic92/nixpkgs-review#usage
          [CONTRIBUTING.md]: https://github.com/NixOS/nixpkgs/blob/master/CONTRIBUTING.md
          [automation/AI policy]: https://github.com/NixOS/nixpkgs/blob/master/CONTRIBUTING.md#automationai-policy
          [maintainers/README.md]: https://github.com/NixOS/nixpkgs/blob/master/maintainers/README.md
          [lib/tests]: https://github.com/NixOS/nixpkgs/blob/master/lib/tests
          [nixos/tests]: https://github.com/NixOS/nixpkgs/blob/master/nixos/tests
          [pkgs/README.md]: https://github.com/NixOS/nixpkgs/blob/master/pkgs/README.md
          [pkgs/test]: https://github.com/NixOS/nixpkgs/blob/master/pkgs/test

          > automated bump via GitHub Actions running on a macos-latest (aarch64-darwin) runner: a workaround for nix-community/nixpkgs-update#513: the shared nixpkgs-update bot runs on Linux workers and can't evaluate/build darwin-only packages like \`iterm2\`.
          EOF
          gh pr create \
            --repo ${{ steps.target.outputs.repo }} \
            --head emaiax:update/iterm2 \
            --base ${{ steps.target.outputs.base }} \
            --title "iterm2: ${{ steps.old_version.outputs.version }} -> ${{ steps.version.outputs.version }}" \
            --body-file pr-body.md
