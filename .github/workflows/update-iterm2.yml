name: auto-update-iterm2

on:
  schedule:
    - cron: "0 10 * * 1" # weekly, Mondays 10:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Don't open a PR, just commit and push the branch"
        type: boolean
        default: true
      target:
        description: "Repo to open the PR against"
        type: choice
        options:
          - upstream
          - origin
        default: origin

concurrency:
  group: update-iterm2
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      up_to_date: ${{ steps.existing.outputs.up_to_date }}
      old_version: ${{ steps.old_version.outputs.version }}
      new_version: ${{ steps.version.outputs.version }}
      repo: ${{ steps.target.outputs.repo }}
      base: ${{ steps.target.outputs.base }}
    steps:
      - name: Sync fork's master with upstream
        env:
          GH_TOKEN: ${{ secrets.NIXPKGS_AUTO_UPDATE_TOKEN }}
        run: gh repo sync emaiax/nixpkgs --branch master

      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1 # content is fully replaced by the reset below
          persist-credentials: false # otherwise this shadows GH_TOKEN below

      - name: Resolve the PR target repo
        id: target
        run: |
          if [ "${{ github.event.inputs.target }}" = "upstream" ]; then
            echo "repo=NixOS/nixpkgs" >> "$GITHUB_OUTPUT"
            echo "base=master" >> "$GITHUB_OUTPUT"
          else
            echo "repo=emaiax/nixpkgs" >> "$GITHUB_OUTPUT"
            echo "base=update/iterm2-base" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync local checkout with upstream nixpkgs
        run: |
          git remote add upstream https://github.com/NixOS/nixpkgs.git
          git fetch --depth 1 upstream master
          git reset --hard upstream/master

      - name: Read the current version
        id: old_version
        run: |
          old_version=$(grep -oP 'version = "\K[^"]+' pkgs/by-name/it/iterm2/package.nix)
          echo "version=$old_version" >> "$GITHUB_OUTPUT"

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v30
        with:
          nix_conf: |
            experimental-features = nix-command flakes

      - name: Run iterm2's update.sh
        run: |
          nix shell nixpkgs#curl nixpkgs#coreutils nixpkgs#common-updater-scripts \
            --command bash pkgs/by-name/it/iterm2/update.sh

      - name: Check for a version change
        id: diff
        run: |
          if git diff --quiet -- pkgs/by-name/it/iterm2/package.nix; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Read the new version
        if: steps.diff.outputs.changed == 'true'
        id: version
        run: |
          version=$(grep -oP 'version = "\K[^"]+' pkgs/by-name/it/iterm2/package.nix)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check if this version is already proposed on the target repo
        id: existing
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.NIXPKGS_AUTO_UPDATE_TOKEN }}
          GIT_TERMINAL_PROMPT: "0" # fail fast instead of hanging on a credential prompt
        run: |
          echo "up_to_date=false" >> "$GITHUB_OUTPUT"
          if git -c credential.helper= fetch --depth=1 origin update/iterm2; then
            open_pr=$(gh pr list --repo ${{ steps.target.outputs.repo }} --head update/iterm2 --state open --json number,headRepositoryOwner --jq '[.[] | select(.headRepositoryOwner.login == "emaiax")][0].number')
            existing_version=$(git show FETCH_HEAD:pkgs/by-name/it/iterm2/package.nix | grep -oP 'version = "\K[^"]+')
            if [ -n "$open_pr" ] && [ "$existing_version" = "${{ steps.version.outputs.version }}" ]; then
              echo "PR #$open_pr already proposes iterm2 ${{ steps.version.outputs.version }}; nothing new to open."
              echo "up_to_date=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Commit and push the update/iterm2 branch
        if: steps.diff.outputs.changed == 'true' && steps.existing.outputs.up_to_date != 'true'
        env:
          GH_TOKEN: ${{ secrets.NIXPKGS_AUTO_UPDATE_TOKEN }}
        run: |
          git config user.name "emaiax"
          git config user.email "emaiax@users.noreply.github.com"
          git checkout -B update/iterm2
          base_sha=$(git rev-parse HEAD)
          git add pkgs/by-name/it/iterm2/package.nix
          git commit -m "iterm2: ${{ steps.old_version.outputs.version }} -> ${{ steps.version.outputs.version }}

          https://iterm2.com/downloads.html"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/emaiax/nixpkgs.git" \
            "${base_sha}:refs/heads/update/iterm2-base" update/iterm2

  build:
    runs-on: macos-latest
    needs: prepare
    if: needs.prepare.outputs.changed == 'true' && needs.prepare.outputs.up_to_date != 'true'
    steps:
      - name: Checkout the update/iterm2 branch
        uses: actions/checkout@v4
        with:
          repository: emaiax/nixpkgs
          ref: update/iterm2
          fetch-depth: 1
          persist-credentials: false

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v30

      - name: Build iterm2
        run: nix-build -A iterm2 --no-out-link
